name: Upstream drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: git remote add upstream https://github.com/miuuyy/codex-chatgpt-web.git
      - run: bun run scripts/check-upstream-baseline.ts --strict
