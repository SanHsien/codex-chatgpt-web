name: CodeQL

on:
  # Fork patch (docs/DECISIONS.md 2026-11-24, Actions usage): pushes scan only when JS/TS sources, CodeQL config or this workflow change.
  # Pull requests and the weekly schedule stay unfiltered.
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - ".github/codeql/codeql-config.yml"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
